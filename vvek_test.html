<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ВВЭК — тренажёр тестовых вопросов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#1E2240; --muted:#62677F; --line:#DADDE8;
  --brand:#4F5597; --brand-ink:#FFFFFF; --ok:#1F7A4D; --ok-bg:#E3F3EA; --bad:#B3261E; --bad-bg:#FBE7E5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15172A; --surface:#1F2238; --ink:#ECEDF6; --muted:#A3A7C2; --line:#33375A;
  --brand:#8C92E0; --brand-ink:#15172A; --ok:#6FD39E; --ok-bg:#1C3A2C; --bad:#FF8A80; --bad-bg:#44201F;}}
:root[data-theme="dark"]{
  --bg:#15172A; --surface:#1F2238; --ink:#ECEDF6; --muted:#A3A7C2; --line:#33375A;
  --brand:#8C92E0; --brand-ink:#15172A; --ok:#6FD39E; --ok-bg:#1C3A2C; --bad:#FF8A80; --bad-bg:#44201F;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px}
h1{font-family:"PT Serif",Georgia,"Times New Roman",serif;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:8px 0 10px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 28px;max-width:60ch}
.label{font-weight:700;font-size:14px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;margin:0 0 22px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 18px}
.bar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;gap:12px}
.topic{color:var(--muted);font-size:13px;margin:22px 0 6px}
.q{font-family:"PT Serif",Georgia,serif;font-size:clamp(19px,3.6vw,23px);line-height:1.45;margin:0 0 22px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;line-height:1.4}
.opt .k{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.opt:not(:disabled):hover{border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.verdict{min-height:28px;margin:16px 0 14px;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.score{font-family:"PT Serif",Georgia,serif;font-size:clamp(64px,16vw,112px);line-height:1;margin:10px 0 4px}
.review{margin-top:30px;display:grid;gap:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.card p{margin:0 0 8px}
.card .you{color:var(--bad)} .card .right{color:var(--ok);font-weight:700}
.sol{background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:12px 16px;margin:0 0 16px;line-height:1.5}
.hint{color:var(--muted);font-size:13px;margin-top:18px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <section id="start">
    <h1>ВВЭК: тренажёр тестовых вопросов</h1>
    <p class="lead">Все вопросы с выбором ответа из тестов, контрольных, экзаменов, Google-форм и Quizlet. Выберите темы и проходите вопросы по одному — после каждого ответа сразу видно, верно ли.</p>
    <p class="label">Темы</p>
    <div class="chips" id="topics"></div>
    <label class="toggle"><input type="checkbox" id="shuffle" checked> Перемешать вопросы</label>
    <div class="row">
      <button class="btn" id="go">Начать тест</button>
      <button class="btn ghost" id="goWrong" hidden>Только прошлые ошибки</button>
    </div>
    <p class="hint" id="count"></p>
  </section>

  <section id="quiz" hidden>
    <div class="meta"><span id="pos"></span><span id="sc"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <p class="topic" id="qtopic"></p>
    <p class="q" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <p class="verdict" id="verdict" aria-live="polite"></p>
    <div class="sol" id="sol" hidden></div>
    <div class="row">
      <button class="btn" id="next" disabled>Следующий вопрос</button>
      <button class="btn ghost" id="stop">Завершить</button>
    </div>
    <p class="hint">Клавиши 1–5 выбирают ответ, Enter — следующий вопрос.</p>
  </section>

  <section id="end" hidden>
    <p class="label">Результат</p>
    <p class="score" id="pct"></p>
    <p class="lead" id="summary"></p>
    <div class="row">
      <button class="btn" id="retryWrong">Пройти ошибки ещё раз</button>
      <button class="btn ghost" id="restart">К выбору тем</button>
    </div>
    <div class="review" id="review"></div>
  </section>
</main>

const LETTERS = "abcdef";
const $ = id => document.getElementById(id);
const topics = [...new Set(QUESTIONS.map(q => q.topic))];
let chosen = new Set(topics), order = [], i = 0, right = 0, wrong = [], answered = false;

function loadSaved(){ try{ return JSON.parse(localStorage.getItem("vvek-wrong-v2")||"[]"); }catch(e){ return []; } }
function saveWrong(list){ try{ localStorage.setItem("vvek-wrong-v2", JSON.stringify(list)); }catch(e){} }

function renderTopics(){
  const box = $("topics"); box.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip"; all.textContent = "Все темы";
  all.setAttribute("aria-pressed", chosen.size === topics.length);
  all.onclick = () => { chosen = chosen.size === topics.length ? new Set() : new Set(topics); renderTopics(); };
  box.appendChild(all);
  topics.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t;
    b.setAttribute("aria-pressed", chosen.has(t));
    b.onclick = () => { chosen.has(t) ? chosen.delete(t) : chosen.add(t); renderTopics(); };
    box.appendChild(b);
  });
  const n = QUESTIONS.filter(q => chosen.has(q.topic)).length;
  $("count").textContent = n ? `Вопросов в тесте: ${n}` : "Выберите хотя бы одну тему.";
  $("go").disabled = !n;
  const saved = loadSaved();
  $("goWrong").hidden = !saved.length;
  $("goWrong").textContent = `Только прошлые ошибки (${saved.length})`;
}

function shuffle(a){ for(let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; }

function start(ids){
  order = $("shuffle").checked ? shuffle(ids.slice()) : ids.slice();
  i = 0; right = 0; wrong = [];
  $("start").hidden = true; $("end").hidden = true; $("quiz").hidden = false;
  show();
}

    b.className = "opt";
    b.innerHTML = `<span class="k">${LETTERS[k]}</span><span></span>`;
    b.lastChild.textContent = text;
    b.onclick = () => answer(k);
    box.appendChild(b);
  });
  window.scrollTo({top:0});
}

function answer(k){
  if(answered) return; answered = true;
  const q = QUESTIONS[order[i]], btns = [...$("opts").children];
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add("ok");
  if(k === q.a){ right++; $("verdict").textContent = "Верно"; $("verdict").className = "verdict ok"; }
  else { btns[k].classList.add("bad"); wrong.push({id:order[i], pick:k});
         $("verdict").textContent = "Неверно — правильный ответ выделен зелёным"; $("verdict").className = "verdict bad"; }
  if(q.s){ $("sol").textContent = "Решение: " + q.s; $("sol").hidden = false; }
  $("sc").textContent = `Верно: ${right}`;
  $("next").disabled = false; $("next").focus();
}

function next(){ if(!answered) return; i++; i < order.length ? show() : finish(); }

function finish(){
  const done = answered ? i+1 : i;
  const total = Math.max(done, 1);
  $("quiz").hidden = true; $("end").hidden = false;
  $("pct").textContent = Math.round(right/total*100) + "%";
  $("summary").textContent = `Верных ответов: ${right} из ${done}.` + (wrong.length ? " Ниже — вопросы с ошибками." : " Ни одной ошибки.");
  const saved = new Set(loadSaved());
  order.slice(0, done).forEach(id => saved.delete(id));
  wrong.forEach(w => saved.add(w.id));
  saveWrong([...saved]);
  $("retryWrong").hidden = !wrong.length;
  const rv = $("review"); rv.innerHTML = "";
  wrong.forEach(w => {
    const q = QUESTIONS[w.id], c = document.createElement("div");
    c.className = "card";
    const p1 = document.createElement("p"); p1.textContent = q.q;
    const p2 = document.createElement("p"); p2.className = "you"; p2.textContent = "Ваш ответ: " + q.o[w.pick];
    const p3 = document.createElement("p"); p3.className = "right"; p3.textContent = "Правильно: " + q.o[q.a];
    c.append(p1,p2,p3);
    if(q.s){ const p4 = document.createElement("p"); p4.textContent = "Решение: " + q.s; c.append(p4); } rv.appendChild(c);
  });
  window.scrollTo({top:0});
}

$("go").onclick = () => start(QUESTIONS.map((q,k)=>k).filter(k => chosen.has(QUESTIONS[k].topic)));
$("goWrong").onclick = () => start(loadSaved().filter(k => k < QUESTIONS.length));
$("next").onclick = next;
$("stop").onclick = () => { if(i===0 && !answered){ $("quiz").hidden=true; $("start").hidden=false; renderTopics(); } else finish(); };
$("retryWrong").onclick = () => start(wrong.map(w => w.id));
$("restart").onclick = () => { $("end").hidden = true; $("start").hidden = false; renderTopics(); };
document.addEventListener("keydown", e => {
  if($("quiz").hidden) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= $("opts").children.length) answer(n-1);
  else if(e.key === "Enter" && answered){ e.preventDefault(); next(); }
});
renderTopics();
</script>
</body>
</html>
